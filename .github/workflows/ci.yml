name: Pre-Merge CI Validation

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Pre-Merge Validation & Quality Assurance
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set Up Node.js Runtime (v22)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 3. Verify Lockfile & Install Dependencies
        id: install
        run: |
          echo "::group::npm ci output"
          npm ci
          echo "::endgroup::"

      - name: 4. Verify Dependency Tree & Module Integrity
        id: deps
        run: |
          echo "::group::npm ls output"
          npm ls --depth=0
          echo "::endgroup::"

      - name: 5. Dependency Vulnerability Security Scan
        id: audit
        continue-on-error: true
        run: |
          echo "::group::npm audit output"
          npm audit --audit-level=high || true
          echo "::endgroup::"

      - name: 6. ESLint Static Code Analysis
        id: lint
        run: |
          echo "::group::eslint output"
          npm run lint
          echo "::endgroup::"

      - name: 7. TypeScript Static Analysis & Type Checking
        id: typecheck
        run: |
          echo "::group::tsc --noEmit output"
          npm run typecheck
          echo "::endgroup::"

      - name: 8. Next.js Production Build & Compilation Check
        id: build
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: 1
        run: |
          echo "::group::next build output"
          npm run build
          echo "::endgroup::"

      - name: 9. Install Playwright Chromium & System Dependencies
        id: playwright_install
        run: |
          echo "::group::Playwright browser installation"
          npx playwright install --with-deps chromium
          echo "::endgroup::"

      - name: 10. Execute Test Suite (Smoke, E2E, and API)
        id: test
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: 1
          CI: true
          PORT: 3000
          LEAD_WEBHOOK_URL: 'https://127.0.0.1:9443/mock-webhook'
        run: |
          echo "::group::Playwright test execution"
          npm run test
          echo "::endgroup::"

      - name: 11. Upload Playwright Test Artifacts on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7

      - name: 12. Generate Pre-Merge CI Summary
        if: always()
        run: |
          echo "## 🛡️ Pre-Merge CI Validation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status | Details |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :---: | :--- |" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ steps.install.outcome }}" == "success" ]; then
            echo "| Dependency Installation (\`npm ci\`) | ✅ Passed | Clean install verified against \`package-lock.json\` |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Dependency Installation (\`npm ci\`) | ❌ Failed | Lockfile mismatch or missing package. Run \`npm install\` locally and commit \`package-lock.json\`. |" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ steps.deps.outcome }}" == "success" ]; then
            echo "| Dependency Resolution (\`npm ls\`) | ✅ Passed | All top-level dependencies resolved |" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ steps.deps.outcome }}" == "failure" ]; then
            echo "| Dependency Resolution (\`npm ls\`) | ❌ Failed | Unmet peer dependency or version conflict detected. Run \`npm ls\` locally to diagnose. |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Dependency Resolution (\`npm ls\`) | ⏭️ Skipped | Skipped due to previous failure |" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ steps.audit.outcome }}" == "success" ]; then
            echo "| Security Audit (\`npm audit\`) | ℹ️ Checked | Dependency vulnerability audit completed |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Security Audit (\`npm audit\`) | ⚠️ Advisory | Security advisories identified. Run \`npm audit\` locally to inspect. |" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ steps.lint.outcome }}" == "success" ]; then
            echo "| Code Quality (\`eslint .\`) | ✅ Passed | Zero ESLint errors |" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ steps.lint.outcome }}" == "failure" ]; then
            echo "| Code Quality (\`eslint .\`) | ❌ Failed | Lint errors or React hook violations. Run \`npm run lint\` locally to inspect file and line details. |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Code Quality (\`eslint .\`) | ⏭️ Skipped | Skipped due to previous failure |" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ steps.typecheck.outcome }}" == "success" ]; then
            echo "| Type Checking (\`tsc --noEmit\`) | ✅ Passed | Zero TypeScript compiler errors |" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ steps.typecheck.outcome }}" == "failure" ]; then
            echo "| Type Checking (\`tsc --noEmit\`) | ❌ Failed | Type errors or broken imports found. Run \`npm run typecheck\` locally to view file & line locations. |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Type Checking (\`tsc --noEmit\`) | ⏭️ Skipped | Skipped due to previous failure |" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ steps.build.outcome }}" == "success" ]; then
            echo "| Production Build (\`next build\`) | ✅ Passed | Next.js compilation, bundle optimization, and page generation succeeded |" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ steps.build.outcome }}" == "failure" ]; then
            echo "| Production Build (\`next build\`) | ❌ Failed | Next.js compilation or asset error. Review Step 8 log output above for stack trace. |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Production Build (\`next build\`) | ⏭️ Skipped | Skipped due to previous failure |" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ steps.test.outcome }}" == "success" ]; then
            echo "| Automated Tests (\`playwright test\`) | ✅ Passed | 38/38 Smoke routes, E2E user flows, and API integration tests passed |" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ steps.test.outcome }}" == "failure" ]; then
            echo "| Automated Tests (\`playwright test\`) | ❌ Failed | Runtime route, E2E interaction, or API test failed. Download the \`playwright-test-results\` artifact from the summary page or run \`npm run test\` locally to inspect. |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Automated Tests (\`playwright test\`) | ⏭️ Skipped | Skipped due to previous failure |" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" == "success" ]; then
            echo "> 🛡️ **Result**: All validation checks passed! This branch is verified and safe for review and merge into \`main\`." >> $GITHUB_STEP_SUMMARY
          else
            echo "> ⚠️ **Result**: One or more validation checks failed. Please inspect the failed step log above, apply the fixes locally, and push back to \`dev\`." >> $GITHUB_STEP_SUMMARY
          fi
